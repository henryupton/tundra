name: Test

# Runs on every pull request, and is called by the release workflow so that a push to
# main tests the same way. Kept separate from that workflow because adding a
# pull_request trigger there would also arm the version bump and the PyPI publish.

on:
  pull_request:
  workflow_call:

# A new push to a PR branch makes the in-flight run redundant. Grouping non-PR runs by
# SHA rather than by ref keeps two quick pushes to main from cancelling each other's
# tests, which would fail the release job waiting on them.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ --tb=short -v
